cira:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:cira-attachments}
    region: ${MINIO_REGION:ap-northeast-2}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.tsh.starter.befw   # 蹂몄씤 ?⑦궎吏 寃쎈줈

spring:
  flyway:
    enabled: true
    locations:
      - filesystem:${DDL_BASE_PATH:C:/workspace/tsh/boilerplate/be/befw/ddl/cira}/migration
      - classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    table: flyway_schema_history
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update              # ?댁쁺?먮뒗 none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
      org.hibernate.envers:
        audit_table_suffix: _HIST     # ?대젰 ?뚯씠釉붾챸 ?ㅼ뿉 _HISTORY 遺숈엫


  cache:
    type: ${CACHE_TYPE:simple}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

application:
  tenant: TSH
  module-name: @module-name@
  version: @project.version@
  service-name: @service-name@
  env: LOCAL
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 900000 # 15 minutes
      refresh-token:
        expiration: 604800000 # 7 days
    cors:
      allowed-origins: ${NEXT_PUBLIC_URL:*}
  messaging:
    credential:
      solace: ${SOLACE_SEMP_CREDENTIAL}

    enable:
      solace:
        enable: true
        pub: true
        sub: true
      kafka:
        enable: true
        pub: true
        sub: true


messaging:
  solace:
    host: localhost
    vpn: default
    login:
      user: admin       # client-username
      pwd: admin        # password
    switch:
      producer: true
      consumer: true
    log:
      level: INFO
    policy:
      connect:
        timeout:
          ms: 1000
        retries:
          count: -1
      reconnect:
        retries:
          count: 1
          wait-ms: 1000
      compression:
        level: 5
      message:
        ack-mode: 1
        delivery-mode: PERSISTENT
        alive:
          interval-ms: 0
          limit: 0
      security:
        ssl:
          enable: SSL
          store:
            trust: C:\
            key: C:\






